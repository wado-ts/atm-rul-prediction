apiVersion: apps/v1
kind: Deployment
metadata:
  name: atm-rul-app
  namespace: atm-rul
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atm-rul-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atm-rul-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: atm-rul-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: atm-rul-config
            - secretRef:
                name: atm-rul-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: atm-rul-app
  namespace: atm-rul
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: atm-rul-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequence-builder
  namespace: atm-rul
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sequence-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sequence-builder
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sequence-builder
          image: atm-rul-sequence-builder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9001
          env:
            - name: ARTIFACTS_DIR
              value: artifacts
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: sequence-builder
  namespace: atm-rul
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sequence-builder
  ports:
    - name: http
      port: 9001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: atm-rul
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference
          image: atm-rul-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9002
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: atm-rul
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference
  ports:
    - name: http
      port: 9002
      targetPort: http
