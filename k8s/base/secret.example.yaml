apiVersion: v1
kind: Secret
metadata:
  name: atm-rul-secrets
  namespace: atm-rul
type: Opaque
stringData:
  ORACLE_USER: replace-with-oracle-user
  ORACLE_PASSWORD: replace-with-oracle-password
  ORACLE_DSN: replace-with-oracle-host:1521/service
  POSTGRES_DSN: postgresql://user:password@replace-with-postgres-host:5432/atm_rul
  JWT_SECRET_KEY: replace-with-a-long-random-secret
